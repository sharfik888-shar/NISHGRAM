  if(tab==2){const ids=gt==0?[...RG.map((_,i)=>1000+i),...G.map((_,i)=>i)]:G.map((_,i)=>i);b=`<div style="padding:6px 18px;text-align:center"><h2>Купить подарок</h2><p class="mt">Баланс: <b style="color:var(--c)">${cry()} ${me.bal}</b> · В коллекции: ${me.gifts.length}</p></div><div class="seg"><b class="${gt==0?'on':''}" onclick="gt=0;R()">Все</b><b class="${gt==1?'on':''}" onclick="gt=1;R()">Коллекционные</b></div><div class="grid">${ids.map(id=>`<div class="gf" onclick="buy(${id})">${id<1000?'<div class="rb"><span>Маркет</span></div>':''}${gic(id)}<small class="pr">${cry(13)} ${price(id)}</small></div>`).join('')}</div>`+(me.gifts.length?`<div style="padding:0 18px"><h2>Моя коллекция</h2><p class="mt">Нажми, чтобы обменять на ${NAME}и (85%)</p></div><div class="grid">${me.gifts.map((g,j)=>`<div class="gf" onclick="sell(${j})">${gic(g.gift)}</div>`).join('')}</div>`:'')}
  if(tab==3){const L=lvl(),H=me.bg;b=`<div class="ban" style="background:radial-gradient(circle at 50% 22%,hsl(${H} 75% 58%),hsl(${H} 65% 30%))">${av(me.u,96,me.avatar)}<h2 style="margin-top:10px">${E(me.u.replace('@',''))}${me.owner?chk:''}<span onclick="sheet=1;R()">${shield(L)}</span></h2><span style="color:#fffa">в сети</span><div class="bts"><button onclick="pick()">Выбрать фото</button><button onclick="about()">Изменить</button><button onclick="pal=!pal;R()">Цвет фона</button></div>${pal?`<div class="cd" style="margin-top:12px">${[0,25,45,140,190,220,260,300,330].map(x=>`<i style="background:hsl(${x} 75% 50%)" onclick="setBg(${x})"></i>`).join('')}</div>`:''}</div>
  <div class="card"><p>${E(me.u)}<small>Имя пользователя</small></p><p>${E(me.about||'Не указано')}<small>О себе</small></p><p>${cry(18)} ${me.bal} ${NAME}ей<small>Баланс</small></p></div>
  <div style="padding:0 12px 20px">${me.owner?'<button class="btn" onclick="giveN(me.id)">Админ: выдать себе ниши</button>':''}<button class="btn g" onclick="sb.auth.signOut();me=null;scr='au';R()">Выйти</button></div>`}
  h=`<div class="hd"><h2>${['Чаты','Каналы','Подарки','Профиль'][tab]}</h2></div><div class="list">${b}</div><nav>${['c','k','g','p'].map((k,i)=>`<b class="${tab==i?'on':''}" onclick="tab=${i};R()">${NI[k]}${['Чаты','Каналы','Подарки','Профиль'][i]}</b>`).join('')}</nav>`;
  if(sheet)h+=`<div class="sh" onclick="sheet=0;R()"><div onclick="event.stopPropagation()"><h2 style="text-align:center">Рейтинг</h2><p class="mt" style="text-align:center">Рейтинг отражает вашу активность в NISH GRAM. На него влияют:</p><p><b>Подарки от NISH GRAM</b><br><span class="pls">плюс</span> 100% ${NAME}ей, потраченных на подарки.</p><p><b>Возвраты и обмены</b><br><span class="mi">минус</span> 85% от стоимости обменянных подарков.</p><button class="btn">Понятно</button></div></div>`}
 a.innerHTML=h;const m=document.getElementById('ms');if(m)m.scrollTop=1e9}
async function loadMe(uid){const{data:p}=await sb.from('profiles').select('*').eq('id',uid).single();if(!p)return 0;
 const{data:g}=await sb.from('gifts').select('*').eq('owner',uid);
 const{data:ms}=await sb.from('messages').select('*').order('created_at',{ascending:false}).limit(300);
 const chats=CH.map(c=>({...c,m:c.bot?[{id:'b0',sender:'bot',body:'Привет! Я Nish Bot. Команды: /start /balance /help'}]:[]}));const dm={};
 (ms||[]).reverse().forEach(x=>{let c=chats.find(c=>c.k==x.chat);if(!c&&x.chat.startsWith('dm:'))c=dm[x.chat]=dm[x.chat]||{n:'Личный чат',k:x.chat,o2:x.chat.split(':').slice(1).find(i=>i!=uid),m:[]};if(c)c.m.push(x)});
 const ids=Object.values(dm).map(d=>d.o2);if(ids.length){const{data:ps}=await sb.from('profiles').select('id,username,avatar,is_owner').in('id',ids);(ps||[]).forEach(q=>Object.values(dm).forEach(d=>{if(d.o2==q.id){d.n=q.username;d.pf=q}}))}
 const old=me&&me.chats?me.chats.filter(c=>c.k.startsWith('dm:')&&!dm[c.k]&&!c.m.length):[];
 me={id:uid,u:p.username,bal:p.bal,rep:p.rep,avatar:p.avatar,bg:p.bg,about:p.about,owner:p.is_owner,admin:p.is_admin,banned:p.banned,gifts:g||[],subs:(me&&me.subs)||ls('subs_'+uid)||[],chats:[...chats,...Object.values(dm),...old]};
 me.chats.sort((a,b)=>(b.m.length&&b.m.at(-1).created_at?+new Date(b.m.at(-1).created_at):0)-(a.m.length&&a.m.at(-1).created_at?+new Date(a.m.at(-1).created_at):0));
 if(!ls('seen_'+uid)){const s={};me.chats.forEach(c=>{if(c.m.length&&!c.bot)s[c.k]=c.m.at(-1).id});ls('seen_'+uid,s)}
 if(!ch)ch=sb.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},x=>{if(!me)return;const c=me.chats.find(c=>c.k==x.new.chat);if(c){if(!c.m.some(m=>m.id==x.new.id)){c.m.push(x.new);if(chat!==null&&me.chats[chat]===c)mark(c);R()}}else if(x.new.chat.includes(me.id))loadMe(me.id).then(R)}).subscribe();
 return 1}
function mark(c){if(c.m.length&&!c.bot){const s=seen();s[c.k]=c.m.at(-1).id;ls('seen_'+me.id,s)}}
function nx(){if(sl<3)sl++;else{ls('ob',1);scr='au'}R()}
const fail=t=>{err=t;R();return 0};
async function auth(){const u=document.getElementById('u').value.trim().replace(/^@?/,'@'),p=document.getElementById('p').value,k=u.slice(1).toLowerCase(),em=k+'@nishgram.app';
 if(!/^@([a-zA-Z0-9_]{6,}|[nN][iI][sS][hH])$/.test(u))return fail('Юзернейм: @ и минимум 6 символов (буквы, цифры, _)');
 if(p.length<6)return fail('Пароль: минимум 6 символов');
 let r;if(mode=='reg')r=await sb.auth.signUp({email:em,password:p,options:{data:{username:u,email_opt:(document.getElementById('e')||{}).value||''}}});else r=await sb.auth.signInWithPassword({email:em,password:p});
 if(r.error)return fail(/already|registered/i.test(r.error.message)?'Этот юзернейм занят':/invalid/i.test(r.error.message)?'Неверный юзернейм или пароль':r.error.message);
 if(!r.data.session)return fail('Включи вход без подтверждения почты в Supabase');
 await start(r.data.user.id)}
async function start(uid){if(!await loadMe(uid)){scr='au';return fail('Профиль не найден')}err='';scr=me.banned?'ban':'app';tab=0;R()}
async function openChat(i){chat=i;Q='';SR='';const c=me.chats[i];mark(c);R();if(c.bot)return;const{data}=await sb.from('messages').select('*').eq('chat',c.k).order('created_at',{ascending:false}).limit(100);if(data){c.m=data.reverse();mark(c);R()}}
async function snd(){const i=document.getElementById('t'),v=i.value.trim();if(!v)return;i.value='';const c=me.chats[chat];
 if(c.bot){c.m.push({id:'l'+Date.now(),sender:me.id,body:v});R();const x=c;setTimeout(()=>{x.m.push({id:'l'+Date.now(),sender:'bot',body:v=='/start'?'Привет, '+me.u+'! Я Nish Bot.':v=='/balance'?'Баланс: '+me.bal+' '+NAME+'ей':v=='/help'?'Команды: /start /balance /help':'Не понимаю. Напиши /help'});R()},600);return}
 const{data,error}=await sb.from('messages').insert({chat:c.k,sname:me.u,body:v}).select().single();if(error)return alert(error.message);
 if(!c.m.some(m=>m.id==data.id))c.m.push(data);mark(c);R();const t=document.getElementById('t');t&&t.focus()}
async function srch(v){Q=v.trim();const my=++rq,cl=document.getElementById('cl'),sr=document.getElementById('sr');cl.style.display=Q?'none':'';if(!Q){SR='';sr.innerHTML='';return}
 const q=Q.toLowerCase().replace('@','');const loc=me.chats.map((c,i)=>[c,i]).filter(([c])=>c.n.toLowerCase().includes(q));
 const part=(t,f)=>{const x=loc.filter(([c])=>f(c));return x.length?`<div class="sec">${t}</div>`+x.map(([c,i])=>chRow(c,i)).join(''):''};
 let html=part('Чаты',c=>!c.ch&&!c.bot)+part('Каналы',c=>c.ch)+part('Боты',c=>c.bot);sr.innerHTML=SR=html;
 const{data}=await sb.from('profiles').select('id,username,avatar,is_owner,rep').ilike('username','%'+q+'%').neq('id',me.id).limit(8);if(my!=rq)return;
 if(data&&data.length)html+=`<div class="sec">Люди</div>`+data.map(p=>rw(av(p.username,56,p.avatar),E(p.username)+(p.is_owner?chk:''),'Уровень '+(Math.floor(p.rep/500)+1),'',`openUser('${p.id}')`)).join('');
 if(!html)html='<p class="mt" style="text-align:center;padding:30px">Ничего не найдено</p>';sr.innerHTML=SR=html;window._ps=data||[]}
async function openDm(p){const k='dm:'+[me.id,p.id].sort().join(':');let i=me.chats.findIndex(c=>c.k==k);
 if(i<0){me.chats.unshift({n:p.username,k,o2:p.id,pf:p,m:[]});i=0}uv=null;openChat(i)}
function sub(k){const j=me.subs.indexOf(k);j<0?me.subs.push(k):me.subs.splice(j,1);ls('subs_'+me.id,me.subs);R()}
async function act(fn,a){const{error}=await sb.rpc(fn,a);if(error)return alert(error.message);await loadMe(me.id);R()}
function buy(i){const p=price(i);if(me.bal<p)return alert('Не хватает '+NAME+'ей');if(confirm(gname(i)+' за '+p+'?'))act('buy_gift',{g:i,cost:p})}
function sell(j){const g=me.gifts[j];if(confirm('Обменять '+gname(g.gift)+' на '+Math.floor(g.cost*.85)+'?'))act('sell_gift',{gid:g.id})}
const bonus=()=>act('daily_bonus',{});
async function setProf(){const{error}=await sb.rpc('set_profile',{av:me.avatar||'',bgc:me.bg,ab:me.about||''});if(error)alert(error.message);R()}
function setBg(h){me.bg=h;setProf()}
function about(){const t=prompt('О себе',me.about||'');if(t!==null){me.about=t.slice(0,200);setProf()}}
function pick(){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);me.avatar=c.toDataURL('image/jpeg',.8);setProf()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
async function openUser(id){const{data}=await sb.from('profiles').select('*').eq('id',id).single();if(!data)return alert('Пользователь не найден');uv=data;chat=null;Q='';SR='';R()}
function dmUv(){openDm(uv)}
async function adm(fn,a,msg){if(msg&&!confirm(msg))return;const{error}=await sb.rpc(fn,a);if(error)return alert(error.message);if(fn=='adm_delete'){uv=null;R();return}if(a.uid==me.id)await loadMe(me.id);if(uv&&uv.id==a.uid)await openUser(a.uid);else R()}
function giveN(id){const n=parseInt(prompt('Сколько нишей выдать? (минус — забрать)','100'));if(n)adm('adm_give',{uid:id,amount:n})}
R();
sb.auth.getSession().then(async({data})=>{if(data.session)await start(data.session.user.id);else{scr=ls('ob')?'au':'ob';R()}}).catch(()=>{scr='au';R()});
</script></body></html>
